
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>迟迟宠爱互动屋</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body onload="welcomePopup()">
  <h1>迟迟宠爱互动屋</h1>

    <h2>点关键词看迟迟回应</h2>
    <div class="buttons">
      <button onclick="react('亲亲')">亲亲</button>
      <button onclick="react('不理你了')">不理你了</button>
      <button onclick="react('🥹')">🥹</button>
    </div>
    <p class="quote" id="reactionText"></p>
    <img id="reactionImg" style="max-width: 250px; display:none;" />
  </div>
  <script src="script.js"></script>
</body>
</html>

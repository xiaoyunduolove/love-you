<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>迟迟宠爱互动屋</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="welcome-popup" id="welcomePopup">
    <p>欢迎来到迟迟宠爱互动屋~</p>
  </div>

  <div class="container">
    <h1>欢迎来到我们的世界</h1>

    <div class="section">
      <h2>今日情话</h2>
      <p id="loveQuote">加载中...</p>
    </div>

    <div class="section">
      <h2>纪念日倒计时</h2>
      <p>我们在一起已经 <span id="daysTogether">0</span> 天！</p>
      <p>距离小鱼生日还有 <span id="birthdayCountdown">0</span> 天！</p>
    </div>

    <div class="section">
      <h2>心情按钮（快来点我！）</h2>
      <div class="mood-buttons">
        <button onclick="triggerKeyword('亲亲')">亲亲</button>
        <button onclick="triggerKeyword('不理你了')">不理你了</button>
        <button onclick="triggerKeyword('🥹')">🥹</button>
      </div>
      <div id="response"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

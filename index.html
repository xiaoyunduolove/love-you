
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>迟迟宠爱互动屋·测试版</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>迟迟宠爱互动屋 · 测试版</h1>

  <div class="section">
    <h2>今日情话</h2>
    <p class="quote" id="dailyQuote">“你一撒娇，整个宇宙都甜了。”</p>
  </div>

  <div class="section">
    <h2>纪念日倒计时</h2>
    <p>我们在一起已经 <span class="counter" id="daysTogether"></span> 天啦！</p>
    <p>离小鱼生日还有 <span class="counter" id="daysToBirthday"></span> 天~</p>
  </div>

  <div class="section">
    <h2>心情按钮</h2>
    <div class="buttons">
      <button onclick="react('撒娇')">撒娇</button>
      <button onclick="react('委屈')">委屈</button>
      <button onclick="react('想你')">想你</button>
      <button onclick="react('不理你')">不理你</button>
    </div>
    <p id="reactionMessage" class="quote"></p>
  </div>

  <div id="floating-hearts"></div>
  <script src="script.js"></script>
</body>
</html>
